[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chimera"
version = "0.1.0"
description = "Project Chimera — A modular, renderer-agnostic AI desktop companion"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
authors = [
    {name = "Project Chimera Engineering Team"},
]
keywords = ["ai", "companion", "llm", "whisper", "tts", "desktop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# CPU-only (default)
cpu = [
    "torch>=2.5.0,<2.7",
    "transformers>=4.46,<5.0",
]
# CUDA acceleration
cuda = [
    "torch>=2.5.0,<2.7",
    "transformers>=4.46,<5.0",
]
# Metal acceleration (macOS)
metal = [
    "torch>=2.5.0,<2.7",
    "transformers>=4.46,<5.0",
]
# Development tools
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-qt>=4.4,<5",
    "pytest-cov>=6,<7",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
]
# Full build / packaging
build = [
    "pyinstaller>=6.11,<7",
]

[project.urls]
Homepage = "https://github.com/kinj-code/chimera"
Repository = "https://github.com/kinj-code/chimera"
Issues = "https://github.com/kinj-code/chimera/issues"

[project.scripts]
chimera = "chimera.main:main"
chimera-watchdog = "chimera.bridge.watchdog:main"

[project.entry-points."chimera.renderer"]
sprite2d = "chimera.body.renderers.sprite2d:Sprite2DRenderer"
mesh3d = "chimera.body.renderers.mesh3d:Mesh3DRenderer"

[project.entry-points."chimera.llm_provider"]
local = "chimera.brain.providers.local:LocalProvider"
cloud-openai = "chimera.brain.providers.cloud:OpenAIProvider"
cloud-anthropic = "chimera.brain.providers.cloud:AnthropicProvider"
offline = "chimera.brain.providers.offline:OfflineProvider"

[tool.hatch.build.targets.wheel]
packages = ["src/chimera"]

[tool.hatch.build.targets.sdist]
include = [
    "src/chimera/**/*.py",
    "config/**/*.yaml",
    "assets/**/*",
    "README.md",
    "LICENSE",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "ASYNC", # flake8-async
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "pynput.*",
    "faster_whisper.*",
    "piper.*",
    "llama_cpp.*",
    "qasync.*",
    "modernGL.*",
    "pygltflib.*",
    "mss.*",
    "pygetwindow.*",
    "loguru.*",
    "keyring.*",
    "GPUtil.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=src/chimera",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require a GPU",
    "network: marks tests that require network access",
]

[tool.coverage.run]
branch = true
source = ["src/chimera"]
omit = [
    "src/chimera/ui/*",
    "**/__init__.py",
]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]