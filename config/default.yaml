# Project Chimera — Default Application Configuration
# This file is read on first launch and restored on state corruption.
# User overrides are stored in ~/.config/chimera/user.yaml
# DO NOT edit this file directly; use Settings GUI.

# Schema version for forward-compatible migration.
schema_version: 1

# General application settings.
application:
  first_run_completed: false
  language: "en"
  start_minimized: false
  launch_on_boot: false
  safe_mode: false

# Companion display settings.
companion:
  renderer: "2d"           # "2d" | "3d"
  character: "default"
  scale: 1.0               # logical scale factor (HiDPI-aware internally)
  opacity: 0.95
  always_on_top: true
  position:
    behavior: "remember"   # "remember" | "center" | "follow_active"
    fallback_x: 100
    fallback_y: 100

# Brain / AI settings.
brain:
  provider_chain:
    - "local"
    - "cloud"
    - "offline"
  local:
    model_path: ""          # auto-detected if empty
    quantization: "Q4_K_M"
    n_ctx: 4096
    n_threads: 4
    temperature: 0.8
  cloud:
    primary: "openai"
    model: "gpt-4o-mini"
    temperature: 0.8
    max_tokens: 1024
  offline:
    persona: "friendly"     # pre-scripted persona during fallback
  behavior:
    idle_action_interval_ms: 30000
    max_reactive_gestures_per_minute: 6

# Memory settings.
memory:
  short_term:
    max_turns: 20
  episodic:
    db_path: ""             # ~/.local/share/chimera/memories.db
    max_days: 90
  long_term:
    enabled: false
    engine: "faiss"         # "faiss" | "chromadb"
    max_entries: 5000

# Audio pipeline.
audio:
  stt:
    engine: "faster-whisper"
    model_size: "base"      # "tiny" | "base" | "small" | "medium"
    device: "auto"          # "auto" | "cpu" | "cuda"
    language: "en"
    vad_mode: "ptt"         # "ptt" (push-to-talk) | "ambient" | "off"
    ptt_hotkey: "<ctrl>+<shift>+t"
  tts:
    engine: "piper"
    voice: "en_US-lessac-medium"
    fallback: "os-tts"      # "os-tts" | "silent"
    speed: 1.0
  output_device: "default"

# Screen awareness / perception.
perception:
  screen_awareness:
    enabled: false           # EXPLICIT OPT-IN — defaults OFF per privacy mandate
    capture_interval_ms: 2000
    redaction:
      enabled: true
      blocked_window_keywords:
        - "*password*"
        - "*bank*"
        - "*1password*"
        - "*bitwarden*"
        - "*lastpass*"
        - "*private*"
  input:
    capture_mouse_hover: true
    capture_file_drops: true

# Telemetry / logging.
telemetry:
  log_level: "INFO"          # "TRACE" | "DEBUG" | "INFO" | "WARNING" | "ERROR"
  blackbox_size: 10000
  flush_on_crash: true
  diagnostics_sharing: "ask" # "ask" | "always" | "never"

# Watchdog.
watchdog:
  enabled: true
  heartbeat_interval_s: 2
  missed_threshold: 3
  auto_restart: true